<h2 class="catalog-title">Catálogo de Productos</h2>

<div class="product-grid">
  <div *ngFor="let producto of productos" class="product-card">
    <div>
      <h3 class="product-name">{{ producto.nombre }}</h3>
      <p class="product-price">{{ producto.precio | currency:'Q' }}</p>
    </div>
    <button class="btn-add" (click)="agregar(producto)">
      Agregar al Carrito
    </button>
  </div>
</div>
